server.port=${SERVER_PORT:8085}
spring.application.name=ordonnance-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pharmacy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pharmacy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pharmacy_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true