version: '3.8'

networks:
  pharmacy-net:
    driver: bridge

services:
  # --- PERSISTENT MYSQL 8.0 ---
  pharmacy-db:
    image: mysql:8.0
    container_name: pharmacy-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pharmacy_db
      MYSQL_USER: pharmacy_user
      MYSQL_PASSWORD: pharmacy_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-storage:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - pharmacy-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- EUREKA DISCOVERY SERVER ---
  discovery-service:
    build: ./discoveryservices
    container_name: discovery-service
    restart: always
    ports:
      - "8761:8761"
    networks:
      - pharmacy-net

  # --- SPRING CLOUD API GATEWAY ---
  api-gateway:
    build: ./gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    networks:
      - pharmacy-net

  medicament-service:
    build: ./medicament-service
    container_name: medicament-service
    restart: always
    depends_on:
      pharmacy-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://pharmacy-db:3306/pharmacy_db
      - SPRING_DATASOURCE_USERNAME=pharmacy_user
      - SPRING_DATASOURCE_PASSWORD=pharmacy_password
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - pharmacy-net

volumes:
  mysql-storage:
    driver: local